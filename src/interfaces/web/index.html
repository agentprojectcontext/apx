<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the app paints under the notch / home indicator
         once it is installed to a home screen; the layout keeps its own safe-area
         padding. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS has never read the web manifest for standalone mode; these are the
         equivalent, and without them "Add to Home Screen" on an iPhone opens a
         Safari tab with the address bar instead of an app window. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="APX" />
    <meta name="color-scheme" content="dark light" />
    <title>APX — admin</title>
    <link rel="icon" href="/favicon/dark/favicon.ico" />
    <link rel="icon" href="/favicon/white/favicon.ico" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon/dark/favicon.ico" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/white/favicon-16x16.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/white/favicon-32x32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/white/favicon-48x48.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/dark/favicon-16x16.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/dark/favicon-32x32.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/dark/favicon-48x48.png" media="(prefers-color-scheme: dark)" />
    <!-- Unconditional first: Safari does not evaluate `media` on a touch icon,
         and a home-screen install with no icon it recognises gets a screenshot
         of the page instead. The themed ones below are for everyone else. -->
    <link rel="apple-touch-icon" href="/favicon/dark/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/favicon/white/apple-touch-icon.png" media="(prefers-color-scheme: light)" />
    <!-- ONE manifest, no `media`. That attribute is not part of the manifest
         link's contract: browsers take the first `rel=manifest` they find, so
         two of them meant install behaviour depended on which theme happened to
         be listed first. Icons for both themes live inside the one file. -->
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
