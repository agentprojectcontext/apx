# On the public repo's release/v2 branch: a change to the docs site or the install scripts asks main's pages.yml to
# rebuild the GitHub Pages site, which builds apps/docs from this branch into /apx/ (install.sh and install.ps1
# included). A push only runs the workflows of its own commit, so pages.yml on main cannot listen for it itself.
name: site

on:
  push:
    branches: [release/v2]
    paths:
      - "apps/docs/**"
      - "scripts/install/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  pages:
    # Only where pages.yml lives: the public repo.
    if: github.repository == 'agentprojectcontext/apx'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A workflow_dispatch sent with the job's token does start a run (most events sent with it do not).
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
