# Every push to release/v2 and every pull request: the repo gates (preflight), the whole app end to end
# in its own sandbox (Playwright against e2e/env.ts: temp home, fake model, emulated Telegram) and the lightness
# budgets (scripts/perf.ts). Reports are kept as artifacts.
# Release tags build installers; publication requires this workflow to pass for the exact branch commit.
name: verify

on:
  push:
    branches: [release/v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APX_SECRETS: file
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The public repo's history must stay public-safe too (authors, messages, AI trailers). The private working
      # repo's older history is rewritten on the way out instead (rules/RELEASE.md#history).
      # Only the commits this run brings (DECISIONS.md#d-087): a pull request's own (its HEAD is the merge GitHub makes
      # to test it, with the account's own email), a push's new ones; a new branch or tag, what release/v2 lacks.
      - name: Commits (public-safe authors and messages)
        if: github.repository == 'agentprojectcontext/apx'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}"; then
            pnpm check:commits "$BASE..$HEAD_SHA"
          else
            pnpm check:commits "$HEAD_SHA" --not origin/release/v2
          fi
      - name: Browser for headless core tests and the end-to-end run
        run: pnpm exec playwright install --with-deps chromium
      - name: Sandboxed browser readiness
        run: |
          chrome=$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')
          test -x "$chrome"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile apx-test-chromium "%s" flags=(unconfined) {\n  userns,\n}\n' "$chrome" | sudo tee /etc/apparmor.d/apx-test-chromium >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/apx-test-chromium
          node --test apps/core/src/nodes/headless-browser.test.ts
      - name: Electron GTK runtime and window manager for native transition tests
        run: sudo apt-get install --no-install-recommends -y libgtk-3-0t64 openbox
      - name: Mobile test dependencies (its own install)
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Preflight (private terms, schema, lint, typecheck, unit tests)
        run: pnpm preflight
      - name: POSIX installer onboarding
        run: node --test e2e/install/onboarding.test.ts
      - name: Mobile types
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Android bundle (Metro and native module resolution)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/apx-mobile-export"

  # The function coverage run in parts on machines of their own (unit, panel, desktop), merged into one report by
  # coverage-report.
  coverage:
    name: Coverage (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: unit, args: --part=unit }
          # One part: the panel's specs build on each other's state in a single sandbox, so they run in order.
          - { name: panel, args: --part=web }
          - { name: desktop, args: --part=desktop }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APX_SECRETS: file
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser for headless core tests and the end-to-end run
        run: pnpm exec playwright install --with-deps chromium
      - name: Sandboxed browser readiness
        run: |
          chrome=$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')
          test -x "$chrome"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile apx-test-chromium "%s" flags=(unconfined) {\n  userns,\n}\n' "$chrome" | sudo tee /etc/apparmor.d/apx-test-chromium >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/apx-test-chromium
          node --test apps/core/src/nodes/headless-browser.test.ts
      - name: Electron GTK runtime and window manager for native transition tests
        if: matrix.name == 'desktop'
        run: sudo apt-get install --no-install-recommends -y libgtk-3-0t64 openbox
      - name: Mobile test dependencies (its own install)
        if: matrix.name == 'unit'
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Desktop runtime
        if: matrix.name == 'desktop'
        run: node apps/desktop/node_modules/electron/install.js
      - name: Function coverage (this part, with sandboxed cores)
        run: node scripts/test-coverage.ts --e2e ${{ matrix.args }}
      - name: Keep this part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-part-${{ strategy.job-index }}
          # The part's report, not its raw V8 data (hundreds of MB): the merge needs only which functions ran.
          path: |
            coverage/all/parts/*/status.json
            coverage/all/parts/*/functions.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  coverage-report:
    name: Coverage report
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-part-*
          path: coverage/all/parts
      - name: One report from every part
        run: node scripts/test-coverage.ts --e2e --merge
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: |
            coverage/all/functions.json
            coverage/all/functions.md
            coverage/all/parts/*/playwright-report/
            coverage/all/parts/*/test-results/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: Lightness budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APX_SECRETS: file
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the measured panel
        env:
          APX_TEST_COVERAGE: "1"
        run: pnpm build:web
      - name: Lightness budgets
        id: perf
        run: node --no-warnings scripts/perf.ts
      - name: Diagnose a failed performance run
        if: failure() && steps.perf.outcome == 'failure'
        env:
          PERF_DIAGNOSTICS: "1"
          PERF_PORT: "7471"
        run: node --no-warnings scripts/perf.ts
      - name: Keep the performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: e2e/.out/perf*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Only the unit tests (Linux's preflight already checks lint, types and the rest), in parts on several machines.
  unit-portability:
    name: Unit tests (${{ matrix.os }} ${{ matrix.part }}/${{ matrix.parts }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, part: 1, parts: 4 }
          - { os: windows-latest, part: 2, parts: 4 }
          - { os: windows-latest, part: 3, parts: 4 }
          - { os: windows-latest, part: 4, parts: 4 }
          - { os: macos-latest, part: 1, parts: 2 }
          - { os: macos-latest, part: 2, parts: 2 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      APX_SECRETS: file
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser for headless core tests
        run: pnpm exec playwright install chromium
      - name: Mobile test dependencies (its own install)
        if: matrix.part == 1
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: This part of each package's tests
        run: node scripts/test-shard.ts ${{ matrix.part }}/${{ matrix.parts }}
      - name: POSIX installer onboarding
        if: runner.os != 'Windows' && matrix.part == 1
        run: node --test e2e/install/onboarding.test.ts

  verify:
    needs: [preflight, coverage, coverage-report, performance, unit-portability]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          COVERAGE: ${{ needs.coverage.result == 'success' && needs.coverage-report.result || needs.coverage.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          PORTABILITY: ${{ needs.unit-portability.result }}
        run: |
          if [ "$PREFLIGHT" != success ] || [ "$COVERAGE" != success ] || \
             [ "$PERFORMANCE" != success ] || [ "$PORTABILITY" != success ]; then
            echo "::error::Verification failed: preflight=$PREFLIGHT, coverage=$COVERAGE, performance=$PERFORMANCE, portability=$PORTABILITY"
            exit 1
          fi

  # Optional: when verify fails on main, an agent reads the reports and opens a pull request with a fix. Off until the
  # repo sets the variable APX_AUTOFIX=true and the secret ANTHROPIC_API_KEY (see rules/TESTING.md#ci).
  autofix:
    needs: verify
    if: failure() && github.ref == 'refs/heads/main' && vars.APX_AUTOFIX == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verify-reports
          path: .verify-reports
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: perf-reports
          path: .verify-reports/e2e/.out
        continue-on-error: true
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The verify workflow failed on main for commit ${{ github.sha }}. Reports are in .verify-reports/
            (Playwright report, failed-test snapshots under test-results/, perf numbers in e2e/.out/perf.json).
            Follow AGENTS.md. Find the cause, fix the code (never weaken a test, a budget or a gate), run
            `pnpm verify`, and open a pull request against main with a conventional-commit title.
