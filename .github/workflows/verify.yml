# Every push to main and every pull request: the repo gates (preflight, as static checks and unit tests in
# parts), the whole app end to end in its own sandboxes (Playwright against e2e/env.ts: temp home, fake model,
# emulated Telegram) and the lightness budgets (scripts/perf.ts). Reports are kept as artifacts.
# Release tags build installers; publication requires this workflow to pass for the exact branch commit.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What preflight checks besides the unit tests, which run in parts below (`pnpm preflight` is both, in one go),
  # then the lightness budgets: a minute more here rather than a runner of their own waiting in the queue.
  static:
    name: Static checks and lightness budgets (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APX_SECRETS: file
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup
        with:
          mobile: "true"
      # The public repo's history must stay public-safe too (authors, messages, AI trailers). The private working
      # repo's older history is rewritten on the way out instead (rules/RELEASE.md#history).
      # Only the commits this run brings (DECISIONS.md#d-087): a pull request's own (its HEAD is the merge GitHub makes
      # to test it, with the account's own email), a push's new ones; a new branch or tag, what main lacks.
      # v1's history, which main's unification brings in, was public long before and stays out (branch v1).
      - name: Commits (public-safe authors and messages)
        if: github.repository == 'agentprojectcontext/apx'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}"; then
            pnpm check:commits "$BASE..$HEAD_SHA" --not origin/v1
          else
            pnpm check:commits "$HEAD_SHA" --not origin/main origin/v1
          fi
      - name: Static checks (private terms, schema, lint, typecheck, test quality)
        run: pnpm preflight:static
      - name: Mobile types
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Android bundle (Metro and native module resolution)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/apx-mobile-export"
      # The budgets run even when a check above failed: both results are worth having from one run.
      - name: Build the measured panel
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          APX_TEST_COVERAGE: "1"
        run: pnpm build:web
      - name: Lightness budgets
        id: perf
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --no-warnings scripts/perf.ts
      - name: Diagnose a failed performance run
        if: failure() && steps.perf.outcome == 'failure'
        env:
          PERF_DIAGNOSTICS: "1"
          PERF_PORT: "7471"
        run: node --no-warnings scripts/perf.ts
      - name: Keep the performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: e2e/.out/perf*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Preflight's unit tests, every package's, dealt over two machines (scripts/test-shard.ts): together, `pnpm test`.
  unit:
    name: Unit tests (Linux ${{ matrix.part }}/2)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APX_SECRETS: file
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          browser: linux
          mobile: ${{ matrix.part == 1 }}
      - name: Electron GTK runtime and window manager for native transition tests
        run: sudo apt-get install --no-install-recommends -y libgtk-3-0t64 openbox
      - name: This part of each package's tests
        run: node scripts/test-shard.ts ${{ matrix.part }}/2
      - name: POSIX installer onboarding
        if: matrix.part == 1
        run: node --test e2e/install/onboarding.test.ts

  # The function coverage run in parts on machines of their own (unit, panel in three, desktop), merged into one
  # report by coverage-report.
  coverage:
    name: Coverage (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: unit, args: --part=unit }
          # Each panel part has a core of its own and replays the setup project first (playwright.config.ts).
          - { name: panel 1/3, args: --part=web --shard=1/3 }
          - { name: panel 2/3, args: --part=web --shard=2/3 }
          - { name: panel 3/3, args: --part=web --shard=3/3 }
          - { name: desktop, args: --part=desktop }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APX_SECRETS: file
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          browser: linux
          mobile: ${{ matrix.name == 'unit' }}
      - name: Electron GTK runtime and window manager for native transition tests
        if: matrix.name == 'desktop'
        run: sudo apt-get install --no-install-recommends -y libgtk-3-0t64 openbox
      - name: Desktop runtime
        if: matrix.name == 'desktop'
        run: node apps/desktop/node_modules/electron/install.js
      - name: Function coverage (this part, with sandboxed cores)
        run: node scripts/test-coverage.ts --e2e ${{ matrix.args }}
      - name: Keep this part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-part-${{ strategy.job-index }}
          # The part's report, not its raw V8 data (hundreds of MB): the merge needs only which functions ran.
          path: |
            coverage/all/parts/*/status.json
            coverage/all/parts/*/functions.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  coverage-report:
    name: Coverage report
    needs: coverage
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-part-*
          path: coverage/all/parts
      # As many parts as the coverage matrix has: one that never uploaded fails the merge.
      - name: One report from every part
        run: node scripts/test-coverage.ts --e2e --merge --expect-parts=5
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: |
            coverage/all/functions.json
            coverage/all/functions.md
            coverage/all/parts/*/playwright-report/
            coverage/all/parts/*/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Only the unit tests (Linux's static checks cover lint, types and the rest), in parts on several machines. Windows
  # waits three times longer in tests that wait (TEST_TIME_SCALE) and reruns a failed file once, reporting it as
  # flaky (DECISIONS.md#d-145); windows.yml runs the same parts on feature branches before they merge.
  unit-portability:
    name: Unit tests (${{ matrix.os }} ${{ matrix.part }}/${{ matrix.parts }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, part: 1, parts: 4 }
          - { os: windows-latest, part: 2, parts: 4 }
          - { os: windows-latest, part: 3, parts: 4 }
          - { os: windows-latest, part: 4, parts: 4 }
          - { os: macos-latest, part: 1, parts: 2 }
          - { os: macos-latest, part: 2, parts: 2 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      APX_SECRETS: file
      CI: "true"
      TEST_TIME_SCALE: ${{ matrix.os == 'windows-latest' && '3' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: chromium
          mobile: ${{ matrix.part == 1 }}
      - name: This part of each package's tests
        shell: bash
        run: node scripts/test-shard.ts ${{ matrix.part }}/${{ matrix.parts }} ${{ runner.os == 'Windows' && '--rerun-failed' || '' }}
      - name: POSIX installer onboarding
        if: runner.os != 'Windows' && matrix.part == 1
        run: node --test e2e/install/onboarding.test.ts

  verify:
    needs: [static, unit, coverage, coverage-report, unit-portability]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          COVERAGE: ${{ needs.coverage.result == 'success' && needs.coverage-report.result || needs.coverage.result }}
          PORTABILITY: ${{ needs.unit-portability.result }}
        run: |
          if [ "$STATIC" != success ] || [ "$UNIT" != success ] || [ "$COVERAGE" != success ] || \
             [ "$PORTABILITY" != success ]; then
            echo "::error::Verification failed: static+budgets=$STATIC, unit=$UNIT, coverage=$COVERAGE, portability=$PORTABILITY"
            exit 1
          fi

  # Optional: when verify fails on main, an agent reads the reports and opens a pull request with a fix. Off until the
  # repo sets the variable APX_AUTOFIX=true and the secret ANTHROPIC_API_KEY (see rules/TESTING.md#ci).
  autofix:
    needs: verify
    if: failure() && github.ref == 'refs/heads/main' && vars.APX_AUTOFIX == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verify-reports
          path: .verify-reports
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: perf-reports
          path: .verify-reports/e2e/.out
        continue-on-error: true
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The verify workflow failed on main for commit ${{ github.sha }}. Reports are in .verify-reports/
            (Playwright report, failed-test snapshots under test-results/, perf numbers in e2e/.out/perf.json).
            Follow AGENTS.md. Find the cause, fix the code (never weaken a test, a budget or a gate), run
            `pnpm verify`, and open a pull request against main with a conventional-commit title.
