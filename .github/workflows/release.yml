# A version tag (v2.0.1) builds, on each OS, the desktop installer and the daemon bundle for servers (pnpm package) and
# attaches them, with their .sha256 and the install scripts, to a GitHub Release of that tag. The tag is the version:
# no bump commit.
name: release

on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v2.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One job opens the release so the three builds only upload to it.
  open:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "APX ${TAG#v}" --generate-notes --verify-tag

  installers:
    needs: open
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # No signing certificates yet: the builder must not look for one.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version from the tag
        shell: bash
        run: cd apps/desktop && npm pkg set version="${TAG#v}"
      - name: Installer, daemon bundle and install scripts
        shell: bash
        run: pnpm package
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" out/*.{AppImage,exe,dmg,zip,tar.gz,sha256,sh,ps1} --clobber

  # The phone app as an installable APK (Expo prebuild + Gradle; the release build signs with the template's debug
  # key, enough to sideload — the Play Store needs its own key later).
  android:
    needs: open
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Native project
        working-directory: apps/mobile
        run: |
          node -e 'const f="app.json",j=require("./"+f);j.expo.version=process.env.TAG.slice(1);require("fs").writeFileSync(f,JSON.stringify(j,null,2))'
          npx expo prebuild --platform android --no-install
      - name: APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "APX-${TAG#v}-android.apk"
          gh release upload "$TAG" "APX-${TAG#v}-android.apk" --clobber
