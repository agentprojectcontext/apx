name: Release

on:
    push:
        branches: [main]

# Serialize releases: if a release is already running, queue this one
# instead of running it in parallel. Prevents the "cannot lock ref
# 'refs/heads/main'" push race when two pushes hit main close together.
concurrency:
    group: release
    cancel-in-progress: false

permissions:
    id-token: write
    pull-requests: write
    contents: write
    issues: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org/

            # --legacy-peer-deps: opentui-spinner@0.0.6 pins @opentui/core@^0.1.49
            # but the project uses ^0.2.8; without this flag npm 10+ refuses
            # with ERESOLVE. Removing opentui-spinner would also work but it
            # is used by the new TUI.
            - run: npm install --legacy-peer-deps

            # `npm install` runs `prepare`, which points core.hooksPath at
            # .githooks — so semantic-release's own `git push` fires the local
            # pre-push gate. That gate runs `lint:web`, which needs the panel's
            # separate pnpm install this job does not do, so every release since
            # the gate landed died with "Cannot find package 'typescript-eslint'"
            # AFTER tagging. The checks the hook exists to enforce are the CI
            # workflow's job here; on this runner it is a broken duplicate.
            - name: Take the local pre-push gate out of the way
              run: |
                  mkdir -p .no-hooks
                  git config core.hooksPath .no-hooks

            - run: npm run test
            - run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
