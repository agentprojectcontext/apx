# A version tag (v2.0.1) builds, on each OS, the desktop installer and the daemon bundle for servers (pnpm package) and
# attaches them, with their .sha256 and the install scripts, to a GitHub Release of that tag. The tag is the version:
# no bump commit.
name: release

on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v2.0.0"
        required: true
      android_abis:
        description: "Android ABIs in the APK, comma-separated (default arm64-v8a; e.g. armeabi-v7a,arm64-v8a,x86_64)"
        required: false
      announce_only:
        description: "Only announce the existing release on Discord, without building"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Keep incomplete releases invisible to clients until every platform has uploaded its files.
  open:
    if: ${{ !inputs.announce_only }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # While v1 and v2 share the repo, v1 keeps GitHub's "Latest" (its npm users and links point there); v2 builds
      # still reach v2 installs, which pick the newest v2.x.y themselves. APX_V2_LATEST=true once main is v2.
      - run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "APX ${TAG#v}" --generate-notes --verify-tag --draft --latest="${{ vars.APX_V2_LATEST == 'true' }}"

  installers:
    needs: open
    strategy:
      fail-fast: false
      matrix:
        # Servers are often arm64 (Raspberry Pi, ARM VPS) and some Macs are still Intel: those cross-build (native
        # modules and Node come prebuilt for the target).
        include:
          - { os: ubuntu-latest, target: linux --x64, scripts: true }
          - { os: ubuntu-latest, target: linux --arm64 }
          - { os: windows-latest, target: win --x64 }
          - { os: macos-latest, target: mac --arm64 }
          - { os: macos-latest, target: mac --x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # No signing certificates yet: the builder must not look for one.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The panel says "Beta" beside its version until v2 is the repo's Latest.
      APX_CHANNEL: ${{ vars.APX_V2_LATEST != 'true' && 'beta' || '' }}
    steps:
      # Every tag and branch: the build carries what each release changed and the branch it came from (stage.ts).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version from the tag
        shell: bash
        run: cd apps/desktop && npm pkg set version="${TAG#v}"
      - name: Installer, daemon bundle and install scripts
        shell: bash
        env:
          # APX's Google sign-in, written into the build only (DECISIONS.md#d-130); empty in a fork.
          APX_GOOGLE_CLIENT: ${{ secrets.APX_GOOGLE_CLIENT }}
        run: node scripts/package.ts ${{ matrix.target }}
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(out/*.{AppImage,exe,dmg,zip,tar.gz,sha256})
          # Every build makes the same install scripts: one job attaches them (two uploads of one name collide).
          if [ "${{ matrix.scripts }}" = "true" ]; then files+=(out/*.{sh,ps1}); fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # The phone app as an installable APK (Expo prebuild + Gradle). Signed with the repo's release key (the same secrets as
  # v1's APK) so every later APK installs over it; without them (a fork) the template's debug key, enough to sideload.
  android:
    needs: open
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # app.config.js reads these at prebuild and again inside Gradle: the versionCode follows the tag's version, the
      # APK carries these ABIs, and with an EAS project id (a repo variable) the app registers for Expo push.
      APX_ANDROID_ABIS: ${{ inputs.android_abis || vars.APX_ANDROID_ABIS || 'arm64-v8a' }}
      APX_EAS_PROJECT_ID: ${{ vars.APX_EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      # Expo push on Android goes through FCM: the Firebase app's google-services.json, kept as a secret.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::No ANDROID_GOOGLE_SERVICES_JSON_BASE64 secret: the APK gets push only through ntfy."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/google-services.json"
          echo "APX_GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
      - name: Native project
        working-directory: apps/mobile
        run: |
          node -e 'const f="app.json",j=require("./"+f);j.expo.version=process.env.TAG.slice(1);require("fs").writeFileSync(f,JSON.stringify(j,null,2))'
          npx expo prebuild --platform android --no-install
      - name: Signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/apx-release.jks"
          echo "file=$RUNNER_TEMP/apx-release.jks" >> "$GITHUB_OUTPUT"
      - name: APK
        working-directory: apps/mobile/android
        env:
          KEYSTORE: ${{ steps.keystore.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The Android plugin's injected signing properties override the debug config Expo's template writes.
        run: |
          signing=()
          if [ -n "$KEYSTORE" ]; then
            signing=(-Pandroid.injected.signing.store.file="$KEYSTORE" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias=apx -Pandroid.injected.signing.key.password="$KEY_PASSWORD")
          fi
          ./gradlew assembleRelease --no-daemon "${signing[@]}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="APX-${TAG#v}-android.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release upload "$TAG" "$apk" "$apk.sha256" --clobber

  publish:
    needs: [installers, android]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require verification of the released commit
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow verify.yml --branch release/v2 --commit "$sha" \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::error::No verification run exists for release commit $sha on release/v2"
            exit 1
          fi
          gh run watch "$run" -R "$GITHUB_REPOSITORY" --exit-status --interval 30
      - run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest="${{ vars.APX_V2_LATEST == 'true' }}"

  # Once every file is published, announce the release with v1's webhook.
  announce:
    needs: [publish]
    if: ${{ always() && (inputs.announce_only || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      ROLE_ID: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
      BETA: ${{ vars.APX_V2_LATEST != 'true' && '1' || '' }}
    steps:
      # The branch's script (an older tag may not have it), with every tag to read the release's commits from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
      - run: node --no-warnings scripts/discord-release.ts

  # Then each issue a commit of this release names (an `Issue: #N` trailer) is told the version and closed.
  issues:
    needs: [announce]
    if: ${{ always() && needs.announce.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11"
      - run: node --no-warnings scripts/issue-replies.ts
