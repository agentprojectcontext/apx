name: CI

# Verify code BEFORE it lands.
#
# Until this existed, the only workflow that ran tests was release.yml, which
# triggers on push to main — i.e. after the merge. A red test blocked the
# release, not the code coming in. Meanwhile package.json already defined a
# correct composite gate (`preflight`) that nothing invoked.
#
# The `release` job at the foot of this file used to be that separate workflow,
# firing on the same trigger rather than after this one — which is how a red
# run and a published version came to sit on the same commit. It is a job now,
# so `needs:` can hold it back.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Only a PR run is cancelled by a newer push. A run on main now carries the
  # `release` job, and workflow-level cancellation kills jobs that are already
  # running — which could cut semantic-release between `npm publish` and the
  # tag, leaving the registry ahead of the repo. A job-level `concurrency`
  # cannot defend against that; not cancelling main is what does.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (root)
        run: pnpm install --frozen-lockfile

      # The web panel is a separate workspace with its own lockfile.
      - name: Install (web panel)
        run: pnpm install --frozen-lockfile
        working-directory: src/interfaces/web

      - name: Lint
        run: pnpm run lint

      # The panel is a separate workspace, so the run above never sees its
      # ~47k lines of TS/TSX. Errors are absolute; warnings ratchet against a
      # baseline in scripts/lint-web.js and may only fall.
      - name: Lint (web panel)
        run: pnpm run lint:web

      # Backend suite. The script also enforces "0 skipped, 0 todo" — a skipped
      # test is a test nobody is watching.
      - name: Test
        run: pnpm run test:ci

      - name: Web build
        run: node scripts/build-web.js

      - name: Web typecheck
        run: npx --no-install tsc --noEmit
        working-directory: src/interfaces/web

      # Ratchet: the vendored TUI fork's error count may fall, never rise.
      - name: TUI typecheck
        run: node scripts/typecheck-tui.js

  # The Playwright suite: 14 specs that drive the real panel against a real
  # daemon. They existed for months and nothing ran them — not preflight, not
  # pre-push, not CI — so they were documentation of intent rather than a gate.
  #
  # Kept as its OWN job, deliberately: it needs a booted daemon and a browser,
  # so it is an order of magnitude slower and more fragile than `verify`. A
  # failure here should be read as "the panel broke", but `verify` stays the
  # fast signal that blocks the obvious mistakes.
  #
  # If a spec proves flaky, stabilise the spec. Do not delete the job — that is
  # how these stopped running the first time.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (root)
        run: pnpm install --frozen-lockfile

      - name: Install (web panel)
        run: pnpm install --frozen-lockfile
        working-directory: src/interfaces/web

      # e2e/global-setup.ts shells out to `apx init` to build its throwaway
      # project, so the CLI has to be on PATH. A shim beats `pnpm link --global`
      # here: no global store to configure, and it points at this checkout, so
      # the specs exercise the code under test rather than a published tarball.
      - name: Put the apx CLI on PATH
        run: |
          printf '#!/bin/sh\nexec node "%s/src/interfaces/cli/index.js" "$@"\n' "$PWD" | sudo tee /usr/local/bin/apx >/dev/null
          sudo chmod +x /usr/local/bin/apx
          apx --version

      # The daemon only mounts the SPA (and with it the 404-that-still-serves-
      # the-shell) when src/interfaces/web/dist exists — see api/web.js. Every
      # other spec drives the vite dev server on :7431 and never noticed; the
      # one spec that asks the DAEMON for an unknown route got the bare JSON
      # 404 and failed on every push since the job was added.
      - name: Build the web bundle
        run: node scripts/build-web.js

      - name: Start the daemon
        run: |
          node src/host/daemon/index.js > /tmp/apx-daemon.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:7430/api/health >/dev/null; then
              echo "daemon up after ${i}s"; curl -s http://127.0.0.1:7430/api/health; exit 0
            fi
            sleep 1
          done
          echo "daemon never became healthy"; cat /tmp/apx-daemon.log; exit 1

      # `--with-deps` shells out to `apt-get update`, and the hosted runner
      # ships with Google's Chrome repository configured. When that index
      # arrives out of sync the fetch fails with `Hash Sum mismatch`, apt exits
      # 100, and the job dies having never opened a browser — a red `e2e` that
      # says nothing about the panel. It is the runner's network, so it is
      # retried rather than read as a break; three attempts, and a third
      # failure is a real outage worth stopping for.
      - name: Install Playwright browser
        run: |
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install failed (attempt ${attempt}/3); retrying in 15s"
            sleep 15
          done
          echo "playwright install failed three times — treating it as a real failure"
          exit 1
        working-directory: src/interfaces/web

      - name: E2E
        run: pnpm exec playwright test
        working-directory: src/interfaces/web

      # The report and the daemon log are the only evidence of WHY a headless
      # run failed, so keep them even (especially) when the step above did not.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/interfaces/web/e2e/.playwright-report
            /tmp/apx-daemon.log
          retention-days: 7
          if-no-files-found: ignore

  # Publishing hangs off the gate above — and until 2026-09-14 it did not.
  #
  # `release.yml` was its own workflow on `push: [main]` with no `needs` and no
  # `workflow_run`, so npm got a new version whether or not anything passed.
  # And it did: 1.108.0 went out on `ba511f9` with the `e2e` job red, as did the
  # two commits after it — three green Releases sitting next to three red CIs.
  # The job's only check was `npm run test`: no lint, no web lint, no web build,
  # no panel typecheck, no e2e. A gate that does not stand between the code and
  # the registry is a report, not a gate.
  #
  # It lives HERE, in the same file, because `needs:` only reaches jobs in the
  # same workflow. The alternative — `workflow_run` — has to re-derive the
  # commit and re-create the branch by hand (semantic-release refuses to
  # publish from the detached HEAD a SHA checkout leaves you on), and none of
  # that plumbing can be tested before it is already on main. `needs` is the
  # primitive that already means "after this passed".
  #
  # The release commit carries `[skip ci]`, so publishing does not re-trigger
  # this workflow and there is no loop. When `e2e` flakes, "Re-run failed jobs"
  # re-runs it and the release follows on success — so it needs no separate
  # escape hatch.
  release:
    needs: [verify, e2e]
    # This `if` narrows; it does not widen. A job-level condition only escapes
    # the `needs` gate when it calls a status function (`always()`,
    # `failure()`, `cancelled()`) — this one does not, so the implicit
    # `success()` on both jobs above still holds. Do not add `always()` here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Least privilege: this is the only job that writes tags, releases or npm.
    # `verify` and `e2e` keep the default read scope.
    permissions:
      id-token: write
      pull-requests: write
      contents: write
      issues: write
    # Never cancelled by a newer push. A release interrupted between
    # `npm publish` and the tag leaves the registry ahead of the repo, which is
    # the one state nothing here can clean up automatically.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # --legacy-peer-deps: opentui-spinner@0.0.6 pins @opentui/core@^0.1.49
      # but the project uses ^0.2.8; without this flag npm 10+ refuses
      # with ERESOLVE. Removing opentui-spinner would also work but it
      # is used by the new TUI.
      - run: npm install --legacy-peer-deps

      # `npm install` runs `prepare`, which points core.hooksPath at
      # .githooks — so semantic-release's own `git push` fires the local
      # pre-push gate. That gate runs `lint:web`, which needs the panel's
      # separate pnpm install this job does not do, so every release since
      # the gate landed died with "Cannot find package 'typescript-eslint'"
      # AFTER tagging. The checks that hook exists to enforce are the two jobs
      # this one waits on; on this runner it is a broken duplicate.
      - name: Take the local pre-push gate out of the way
        run: |
          mkdir -p .no-hooks
          git config core.hooksPath .no-hooks

      - run: npm run test

      # semantic-release decides whether there IS a release from the commit
      # subjects, and says so only in its log. Reading the version on either
      # side of it is the reliable signal: @semantic-release/npm writes the new
      # number into package.json, so a change means something shipped.
      - name: Version before
        id: before
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Announced from HERE, not from a `on: release` workflow: semantic-release
      # signs the release with the default GITHUB_TOKEN, and GitHub does not
      # start workflows from events that token creates. Such a workflow would
      # never run, and nothing would say why.
      #
      # EVERY release, patches included. It was minors and majors only while the
      # message was an install line and a link — at 55 versions in 30 days, that
      # many "there is a new version, go read elsewhere" posts is something
      # people mute. Now the announcement carries what actually changed, so a
      # patch is a line worth reading rather than a notification with no content.
      - name: Announce the release on Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BEFORE: ${{ steps.before.outputs.v }}
          GH_TOKEN: ${{ github.token }}
          # Optional repo variable: the id of a role to ping. Not a secret — a
          # role id is public the moment anyone right-clicks the role.
          ROLE_ID: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
        run: |
          after=$(node -p "require('./package.json').version")
          # Same trim as android.yml: a pasted secret carries whatever the
          # clipboard had, and curl's answer to a trailing newline is a bare
          # exit 3 that explains nothing.
          WEBHOOK="$(printf '%s' "$WEBHOOK" | tr -d '[:space:]')"
          if [ -z "$WEBHOOK" ]; then
            echo "no DISCORD_WEBHOOK secret — nothing announced"; exit 0
          fi
          if [ "$BEFORE" = "$after" ]; then
            echo "semantic-release published nothing"; exit 0
          fi
          # The notes semantic-release just wrote ARE the announcement — the
          # message used to be an install line and a link to CHANGELOG.md, so
          # the only way to learn what landed was to leave Discord.
          #
          # Never fatal: the release has already happened and cannot be undone
          # by a failure here, so an unreachable API costs the detail, not the
          # message. The builder handles empty notes and empty credits.
          notes="$(gh release view "v$after" --json body -q .body 2>/dev/null || true)"
          if [ -z "$notes" ]; then
            echo "::warning::could not read the notes for v$after — announcing without them"
          fi
          # Who wrote the commits in this release. The builder drops the bots.
          export APX_RELEASE_CREDITS="$(
            gh api "repos/$GITHUB_REPOSITORY/compare/v$BEFORE...v$after" \
              --jq '[.commits[].author.login] | unique | join(",")' 2>/dev/null || true
          )"
          printf '%s' "$notes" | node scripts/discord-release-payload.js \
            "$after" "$GITHUB_REPOSITORY" "$BEFORE" "$ROLE_ID" > payload.json

          # Discord answers a rejected payload with a 400 and a body saying why,
          # and `curl -f` would hide both. The status is read instead.
          post() {
            curl -sS -o /tmp/discord-response.json -w '%{http_code}' \
              -X POST -H "Content-Type: application/json" -d @"$1" "$WEBHOOK"
          }
          code="$(post payload.json)"
          if [ "$code" -ge 400 ]; then
            # The buttons are the one part that may not be allowed: Discord only
            # takes message components from an application-owned webhook, and a
            # webhook made from the channel settings is not one. Whether THIS
            # webhook qualifies cannot be known from here, so it is attempted
            # and the announcement falls back rather than being lost to a
            # decoration.
            echo "::warning::Discord refused the message with buttons (HTTP $code): $(cat /tmp/discord-response.json)"
            node -e 'const p=JSON.parse(require("fs").readFileSync("payload.json","utf8")); delete p.components; process.stdout.write(JSON.stringify(p))' > payload-plain.json
            code="$(post payload-plain.json)"
          fi
          if [ "$code" -ge 400 ]; then
            echo "::warning::Discord rejected the announcement (HTTP $code): $(cat /tmp/discord-response.json)"
            exit 0
          fi
          echo "announced v$after (HTTP $code)"
