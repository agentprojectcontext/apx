# The GitHub Pages site at apxagent.app, the repository's custom domain (RELEASE.md#where-v2-lives):
#   /      → v2's home and docs (apps/docs on main), with install.sh and install.ps1 beside them
#   /v1/   → v1's docs (docs/ on the v1 branch), marked as no longer maintained
#   /v2/   → where v2 lived before it was the release: install.sh and install.ps1 stay (installed apps and older
#            docs give that address), and every other /v2/… page lands on the same page at /…
# GitHub sends agentprojectcontext.github.io/apx/… on to apxagent.app/… itself. Old addresses (v1's /docs/…, v2's
# /v2/…) are sent on by the site's 404 page, the only redirect GitHub Pages serves for a missing path.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "scripts/install/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'agentprojectcontext/apx'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: v2
      - uses: actions/checkout@v5
        with:
          ref: v1
          path: v1

      # v1's docs are their own project (own lockfile, --ignore-workspace) on Node 22 with the pnpm they name.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: v1/docs/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build v1 docs
        working-directory: v1/docs
        env:
          DOCS_BASE: /v1
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm build

      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build v2 site
        working-directory: v2/apps/docs
        env:
          DOCS_BASE: /
          DOCS_SITE: https://apxagent.app
        run: |
          PNPM="$(node -p "require('./package.json').packageManager")"
          npx --yes "$PNPM" install --frozen-lockfile
          npx --yes "$PNPM" build
          npx --yes "$PNPM" check
          test -f dist/install.sh && test -f dist/install.ps1

      - name: Assemble the site
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          cp -R v2/apps/docs/dist/. _site/
          test ! -e _site/v1 && test ! -e _site/v2
          mkdir -p _site/v1 _site/v2
          cp -R v1/docs/dist/. _site/v1/
          cp _site/install.sh _site/install.ps1 _site/v2/
          cat > _site/v2/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>APX</title>
          <meta http-equiv="refresh" content="0; url=/">
          <link rel="canonical" href="https://apxagent.app/">
          <a href="/">APX</a>
          HTML
          # The 404 page sends old addresses on first: /apx/… (links in v1's pages) to /…, v1's /docs/… to /v1/…, v2's
          # /v2/… to /….
          node -e '
            const fs = require("node:fs");
            const page = fs.readFileSync("_site/404.html", "utf8");
            const hop = `<script>{const p=location.pathname,r=location.search+location.hash;if(p.startsWith("/apx/"))location.replace(p.slice(4)+r);else if(p.startsWith("/docs/"))location.replace("/v1/"+p.slice(6)+r);else if(p.startsWith("/v2/"))location.replace("/"+p.slice(4)+r)}</script>`;
            fs.writeFileSync("_site/404.html", page.replace("<head>", "<head>" + hop));
          '
          grep -q '"/v1/"' _site/404.html
          test -f _site/v2/install.sh && test -f _site/v2/install.ps1

      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
