# The GitHub Pages site at apxagent.app, the repository's custom domain (RELEASE.md#where-v2-lives):
#   /      → v2's home and docs (apps/docs on main), with install.sh and install.ps1 beside them
#   /v1/   → v1's docs (docs/ on the v1 branch), marked as no longer maintained
#   /v2/   → where v2 lived before it was the release: install.sh and install.ps1 stay (installed apps and older
#            docs give that address), and every other /v2/… page lands on the same page at /…
# GitHub sends agentprojectcontext.github.io/apx/… on to apxagent.app/… itself. Old addresses (v1's /docs/…, v2's
# /v2/…) are sent on by the site's 404 page, the only redirect GitHub Pages serves for a missing path.
# Existing current /docs/ files take precedence over historical aliases; all v1 content remains under /v1/.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "scripts/install/**"
      - ".github/workflows/pages.yml"
      - "e2e/assembled-docs.config.ts"
      - "e2e/preview/assembled-docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'agentprojectcontext/apx'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: v2
      - uses: actions/checkout@v5
        with:
          ref: v1
          path: v1

      # v1's docs are their own project (own lockfile, --ignore-workspace) on Node 22 with the pnpm they name.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: v1/docs/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build v1 docs
        working-directory: v1/docs
        env:
          DOCS_BASE: /v1
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm build

      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build v2 site
        working-directory: v2/apps/docs
        env:
          DOCS_BASE: /
          DOCS_SITE: https://apxagent.app
        run: |
          PNPM="$(node -p "require('./package.json').packageManager")"
          npx --yes "$PNPM" install --frozen-lockfile
          npx --yes "$PNPM" build
          npx --yes "$PNPM" check
          test -f dist/install.sh && test -f dist/install.ps1

      - name: Assemble the site
        run: |
          node v2/apps/docs/scripts/assemble-site-cli.mjs v1/docs/dist v2/apps/docs/dist _site
          grep -q '"/v1/"' _site/404.html
          test -f _site/v2/install.sh && test -f _site/v2/install.ps1

      - name: Verify the assembled site in Chromium
        working-directory: v2
        env:
          DOCS_V1_DIST: ../v1/docs/dist
        run: |
          PNPM="$(node -p "require('./package.json').packageManager")"
          npx --yes "$PNPM" install --frozen-lockfile --ignore-scripts
          npx --yes "$PNPM" exec playwright install --with-deps chromium
          npx --yes "$PNPM" exec playwright test --config e2e/assembled-docs.config.ts

      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
