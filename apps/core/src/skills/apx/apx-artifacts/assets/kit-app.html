<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apx-surface" content="app">
<title>Focus board</title>
<script src="/_apx/kit@1.js"></script>
</head>
<body>
<div class="ax-app" data-ax-views data-ax-persist="ui.view">
  <nav class="ax-rail" aria-label="Sections">
    <button class="ax-rail__btn" data-view="tasks" data-label="Tasks" data-ax-tip="Tasks"><ax-icon name="check"></ax-icon></button>
    <button class="ax-rail__btn" data-view="notes" data-label="Notes" data-ax-tip="Notes"><ax-icon name="edit"></ax-icon></button>
    <div class="ax-rail__spacer"></div>
    <button class="ax-rail__btn" data-view="settings" data-label="Settings" data-ax-tip="Settings"><ax-icon name="settings"></ax-icon></button>
  </nav>

  <div class="ax-shell">
    <header class="ax-topbar">
      <div class="ax-topbar__title"><span data-view-title>Tasks</span> <small id="summary"></small></div>
      <button class="ax-btn ax-btn--primary" data-ax-ask="Look at my focus board and suggest what to do next">Ask for a plan</button>
    </header>

    <main class="ax-main">
      <div class="ax-main__inner">
        <section class="ax-stack" data-view-panel="tasks">
          <form class="ax-toolbar" id="add">
            <label class="ax-field ax-grow"><span>New task</span><input class="ax-input" name="title" required maxlength="120" placeholder="What needs doing?"></label>
            <button class="ax-btn" type="submit">Add</button>
          </form>
          <div class="ax-seg" id="show"><button value="open">Open</button><button value="done">Done</button><button value="all">All</button></div>
          <div class="ax-list" id="tasks"></div>
          <div class="ax-empty" id="empty" hidden>Nothing here. Add a task above.</div>
        </section>

        <section class="ax-stack" data-view-panel="notes" hidden>
          <div class="ax-card">
            <h2 class="ax-card__title">Scratchpad</h2>
            <p class="ax-card__desc">Saved as you type; it is here the next time you open the app.</p>
            <textarea class="ax-textarea" data-ax-persist="notes" rows="10" placeholder="Ideas, links, reminders…"></textarea>
          </div>
        </section>

        <section class="ax-settings" data-view-panel="settings" hidden>
          <div class="ax-setgroup">
            <h3>Board</h3>
            <div class="ax-setrow"><div>Show finished tasks count<small>In the top bar</small></div><input class="ax-switch" type="checkbox" data-ax-persist="settings.count" checked></div>
            <div class="ax-setrow"><div>Start over<small>Removes every task and note</small></div><button class="ax-btn ax-btn--ghost" id="clear" type="button">Clear</button></div>
          </div>
        </section>
      </div>
    </main>

    <footer class="ax-statusbar"><span class="ax-live" id="saved">Saved</span><span id="where"></span></footer>
  </div>
</div>
<script>
const S = APX.state;
const list = document.getElementById("tasks");
const empty = document.getElementById("empty");
const seg = document.getElementById("show");

const tasks = () => S.get("tasks", []);
const filter = () => S.get("ui.show", "open");

function render() {
  const all = tasks();
  const shown = all.filter((t) => filter() === "all" || (filter() === "done" ? t.done : !t.done));
  list.innerHTML = shown
    .map(
      (t) => `<label class="ax-item ax-option" data-id="${APX.esc(t.id)}">
        <span class="ax-row"><input class="ax-check" type="checkbox" ${t.done ? "checked" : ""}><span class="ax-item__title">${APX.esc(t.title)}</span></span>
        <span class="ax-item__aside"><button class="ax-btn ax-btn--ghost ax-btn--sm" type="button" data-remove>Remove</button></span>
      </label>`,
    )
    .join("");
  list.hidden = !shown.length;
  empty.hidden = shown.length > 0;
  seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.value === filter())));
  const done = all.filter((t) => t.done).length;
  document.getElementById("summary").textContent = S.get("settings.count", true) ? `${done} of ${all.length} done` : "";
  document.getElementById("where").textContent = S.persistent ? "Remembered by APX" : "This page only";
}

document.getElementById("add").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = e.target.elements.title;
  const title = input.value.trim();
  if (!title) return;
  S.set("tasks", [...tasks(), { id: String(Date.now()), title, done: false }]);
  input.value = "";
  APX.toast("Task added");
});
list.addEventListener("change", (e) => {
  const id = e.target.closest("[data-id]")?.dataset.id;
  S.set("tasks", tasks().map((t) => (t.id === id ? { ...t, done: e.target.checked } : t)));
});
list.addEventListener("click", (e) => {
  if (!e.target.closest("[data-remove]")) return;
  e.preventDefault();
  const id = e.target.closest("[data-id]").dataset.id;
  S.set("tasks", tasks().filter((t) => t.id !== id));
});
seg.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) S.set("ui.show", b.value);
});
document.getElementById("clear").addEventListener("click", () => {
  S.patch({ tasks: null, notes: null });
  document.querySelector("[data-ax-persist=notes]").value = "";
});

// Every change, made here, by another open copy or by the agent, redraws the board.
S.on(render);
render();
</script>
</body>
</html>
