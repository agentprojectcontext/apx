containerd:
  system: false
  user: false
ssh:
  forwardAgent: false
propagateProxyEnv: false
user:
  name: apx
  comment: APX
  home: /home/apx
  uid: 1000
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      dpkg --configure -a || apt-get -f install -y --no-install-recommends
      apt-get install -y --no-install-recommends xfce4 xfce4-terminal tigervnc-standalone-server dbus-x11 xauth chromium xdotool x11-utils netcat-openbsd python3 fonts-dejavu nftables
      mkdir -p /home/apx/work /home/apx/.config/autostart
      chown -R apx:apx /home/apx/work /home/apx/.config
      usermod --comment 'APX Lab' apx
