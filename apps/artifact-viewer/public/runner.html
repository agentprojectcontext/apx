<!doctype html>

<head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Public artifact</title></head>

<script>
(() => {
  let loaded = false;
  function memoryHost(initial) {
    const clone = (value) => value === undefined ? undefined : JSON.parse(JSON.stringify(value));
    const data = Object.assign(Object.create(null), initial);
    const listeners = new Set();
    const state = {
      persistent: false,
      all: () => clone(data),
      get: (key, fallback) => Object.hasOwn(data, key) ? clone(data[key]) : fallback,
      patch: (patch) => {
        for (const [key, value] of Object.entries(patch)) {
          if (["__proto__", "constructor", "prototype"].includes(key)) continue;
          if (value === null || value === undefined) delete data[key]; else data[key] = clone(value);
        }
        for (const listener of listeners) listener(clone(data), "local");
      },
      set: (key, value) => state.patch({ [key]: value }),
      remove: (key) => state.patch({ [key]: null }),
      on: (listener) => { listeners.add(listener); return () => listeners.delete(listener); },
    };
    window.apx = { host: "apx", state, sendPrompt: () => window.APX?.toast("Open this copy in APX to continue.") };
  }
  window.addEventListener("message", (event) => {
    if (loaded || event.source !== parent || event.origin !== new URL(location.href).origin) return;
    const message = event.data;
    if (message?.type !== "apx-public-copy" || typeof message.html !== "string" || message.html.length > 400000) return;
    if (!message.state || typeof message.state !== "object" || Array.isArray(message.state)) return;
    loaded = true;
    const page = new DOMParser().parseFromString(message.html, "text/html");
    const seed = page.createElement("script");
    seed.textContent = `(${memoryHost.toString()})(${JSON.stringify(message.state).replace(/</g, "\\u003c")});`;
    page.head.prepend(seed);
    document.open();
    document.write(`<!doctype html>${page.documentElement.outerHTML}`);
    document.close();
  });
})();
</script>
