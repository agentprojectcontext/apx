<!doctype html>
<html>
<head>
<style>
:root{--up:#1fb866;--down:#e5534b}
.w{max-width:860px;margin:0 auto;padding:16px 24px 14px;font-variant-numeric:tabular-nums}
.k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--apx-fg-muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.px{font-size:32px;font-weight:700;letter-spacing:-.01em;margin:4px 0 2px}
.sub{font-size:12px;color:var(--apx-fg-muted)}
.pill{border:1px solid var(--apx-border);border-radius:999px;padding:6px 12px;font-size:12px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up)}
.card{border:1px solid var(--apx-border);border-radius:12px;background:var(--apx-surface);padding:12px 14px}
.range{margin:12px 0 10px;padding:10px 14px}
.bar{position:relative;height:6px;border-radius:3px;background:var(--apx-fill);margin-top:10px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:linear-gradient(90deg,var(--down),#e3a33b,var(--up))}
.bar b{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--apx-fg)}
.chips{display:flex;gap:6px;align-items:center}
.chips button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--apx-border);background:transparent;color:var(--apx-fg);border-radius:8px;padding:5px 11px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--up);border-color:var(--up);color:#06210f}
svg{display:block;width:100%;height:auto}
svg text{font-size:11px;fill:var(--apx-fg-subtle)}
.grid{stroke:var(--apx-border)}
.rsi{display:flex;gap:10px;align-items:center;margin:10px 0 6px}
.tag{border:1px solid var(--apx-border);border-radius:8px;padding:2px 8px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.stats .card{padding:8px 12px}
.stats b{display:block;font-size:16px;margin-top:2px}
.note{font-size:12px;color:var(--apx-fg-muted);margin:8px 0 0}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="w">
  <div class="row" style="align-items:flex-start">
    <div>
      <div class="k">Bitcoin · BTC/USDT</div>
      <div class="px" id="price">$82,732.19</div>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <div class="pill"><span class="dot"></span><span id="feed">Connecting…</span></div>
  </div>

  <div class="card range">
    <div class="row sub"><span>Price range · 24 h</span><span id="range"></span></div>
    <div class="bar"><i id="fill"></i><b id="mark"></b></div>
  </div>

  <div class="row" style="margin-bottom:8px">
    <div class="chips"><span class="k" style="margin-right:4px">Candles</span>
      <button aria-pressed="true">1m</button><button>5m</button><button>15m</button><button>1h</button>
      <span class="sub" style="margin-left:6px">60 candles · volume below</span></div>
  </div>
  <div class="card"><svg id="candles" viewBox="0 0 880 200"></svg></div>

  <div class="rsi"><b>RSI · 14 periods</b><span class="tag" id="rsiv"></span>
    <span class="sub" style="margin-left:auto">Over 70 overbought · under 30 oversold</span></div>
  <div class="card"><svg id="rsi" viewBox="0 0 880 72"></svg></div>

  <div class="stats">
    <div class="card"><span class="sub">Change · 24 h</span><b id="change"></b></div>
    <div class="card"><span class="sub">High · 24 h</span><b id="high"></b></div>
    <div class="card"><span class="sub">Low · 24 h</span><b id="low"></b></div>
    <div class="card"><span class="sub">Volume · 24 h</span><b id="volume"></b></div>
    <div class="card"><span class="sub">Quote volume</span><b id="quote"></b></div>
    <div class="card"><span class="sub">Trades · 24 h</span><b id="trades"></b></div>
  </div>
  <p class="note" id="note"></p>
</div>
<script>
(function () {
  // Binance's public market data (no key): the 24 h ticker and the candles. Without the network, sample figures.
  var API = "https://api.binance.com/api/v3/";
  var N = 60, P = 14, NS = "http://www.w3.org/2000/svg";
  var INTERVALS = ["1m", "5m", "15m", "1h"];
  var interval = "1m", timer;
  function $(id) { return document.getElementById(id); }
  function el(svg, name, attrs) { var e = document.createElementNS(NS, name); for (var k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
  function money(v, d) { return "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }); }
  function compact(v) { var n = Number(v); return n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n.toLocaleString("en-US"); }
  function clock(t) { return new Date(t).toLocaleTimeString("en-US", { hour12: false }); }

  function sample() {
    var seed = 7, r = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    var c = [], p = 82600, now = Date.now();
    for (var i = 0; i < N + P; i++) {
      var o = p, cl = o + (r() - 0.48) * 60, hi = Math.max(o, cl) + r() * 25, lo = Math.min(o, cl) - r() * 25;
      c.push({ o: o, c: cl, h: hi, l: lo, v: 5 + r() * 40, t: now - (N + P - i) * 60000 });
      p = cl;
    }
    var last = c[c.length - 1].c;
    return { candles: c, ticker: { lastPrice: last, priceChangePercent: -0.62, highPrice: 84352, lowPrice: 82410.86, volume: 12969.29, quoteVolume: 1083619382, count: 2301416, closeTime: now }, live: false };
  }

  function load() {
    var ask = function (path) { return fetch(API + path).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); };
    return Promise.all([ask("ticker/24hr?symbol=BTCUSDT"), ask("klines?symbol=BTCUSDT&interval=" + interval + "&limit=" + (N + P))])
      .then(function (res) {
        var candles = res[1].map(function (k) { return { t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[5] }; });
        return { ticker: res[0], candles: candles, live: true };
      })
      .catch(sample);
  }

  function rsi(c) {
    var out = [], g = 0, l = 0;
    for (var i = 1; i < c.length; i++) {
      var d = c[i].c - c[i - 1].c, up = Math.max(d, 0), dn = Math.max(-d, 0);
      if (i <= P) { g += up / P; l += dn / P; } else { g = (g * (P - 1) + up) / P; l = (l * (P - 1) + dn) / P; }
      if (i >= P) out.push(l === 0 ? 100 : 100 - 100 / (1 + g / l));
    }
    return out.slice(-N);
  }

  function draw(data) {
    var t = data.ticker, all = data.candles, c = all.slice(-N), svg = $("candles");
    var last = Number(t.lastPrice), low = Number(t.lowPrice), high = Number(t.highPrice), change = Number(t.priceChangePercent);
    $("price").textContent = money(last);
    $("updated").textContent = (data.live ? "Updated " : "Sample from ") + clock(t.closeTime || Date.now());
    $("feed").textContent = (data.live ? "Live · " : "Sample · ") + interval + " candles";
    document.querySelector(".dot").style.background = data.live ? "var(--up)" : "var(--apx-fg-subtle)";
    $("range").textContent = money(low) + " to " + money(high);
    var pos = Math.max(0, Math.min(100, ((last - low) / (high - low || 1)) * 100));
    $("fill").style.width = pos + "%";
    $("mark").style.left = "calc(" + pos + "% - 1px)";
    $("change").textContent = (change > 0 ? "+" : "") + change.toFixed(2) + "%";
    $("change").style.color = change < 0 ? "var(--down)" : "var(--up)";
    $("high").textContent = money(high);
    $("low").textContent = money(low);
    $("volume").textContent = Math.round(Number(t.volume)).toLocaleString("en-US") + " BTC";
    $("quote").textContent = "$" + compact(t.quoteVolume);
    $("trades").textContent = Number(t.count).toLocaleString("en-US");
    $("note").textContent = (data.live ? "Live from Binance's public BTC/USDT market data. " : "Sample figures: Binance could not be reached. ") +
      "RSI describes past prices; it is not a trading signal or financial advice.";

    svg.textContent = "";
    var lo = Infinity, hi = -Infinity;
    c.forEach(function (k) { lo = Math.min(lo, k.l); hi = Math.max(hi, k.h); });
    var pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
    var vmax = Math.max.apply(null, c.map(function (k) { return k.v; })) || 1;
    var W = 820, top = 8, H = 138, vTop = 150, vH = 30;
    var y = function (v) { return top + ((hi - v) / (hi - lo)) * H; };
    for (var g = 0; g < 5; g++) {
      var v = lo + ((hi - lo) * (4 - g)) / 4, gy = y(v);
      el(svg, "line", { x1: 0, x2: W, y1: gy, y2: gy, class: "grid", "stroke-dasharray": "2 4" });
      el(svg, "text", { x: W + 6, y: gy + 4 }).textContent = v.toLocaleString("en-US", { maximumFractionDigits: 0 });
    }
    var step = W / c.length;
    c.forEach(function (k, i) {
      var x = i * step + step / 2, color = k.c >= k.o ? "var(--up)" : "var(--down)";
      el(svg, "line", { x1: x, x2: x, y1: y(k.h), y2: y(k.l), stroke: color, "stroke-width": 1.2 });
      var bt = y(Math.max(k.o, k.c)), bh = Math.max(1.5, Math.abs(y(k.o) - y(k.c)));
      el(svg, "rect", { x: x - step * 0.32, y: bt, width: step * 0.64, height: bh, fill: color, rx: 1 });
      var vh = 3 + (k.v / vmax) * vH;
      el(svg, "rect", { x: x - step * 0.32, y: vTop + vH - vh + 4, width: step * 0.64, height: vh, fill: color, opacity: 0.35 });
    });
    el(svg, "text", { x: 0, y: 198, style: "fill:var(--up)" }).textContent = c.length + " candles · " + interval;
    el(svg, "text", { x: W - 26, y: 198, style: "fill:var(--up)" }).textContent = "now";

    var r = rsi(all), rs = $("rsi");
    rs.textContent = "";
    var ry = function (v) { return 4 + ((100 - v) / 100) * 64; };
    [70, 50, 30].forEach(function (v) {
      el(rs, "line", { x1: 0, x2: W, y1: ry(v), y2: ry(v), stroke: v === 50 ? "var(--apx-border)" : "var(--down)", "stroke-dasharray": "4 4", opacity: v === 50 ? 1 : 0.6 });
      el(rs, "text", { x: W + 6, y: ry(v) + 4 }).textContent = String(v);
    });
    var rstep = W / r.length;
    var pts = r.map(function (v, i) { return (i * rstep + rstep / 2).toFixed(1) + "," + ry(v).toFixed(1); }).join(" ");
    el(rs, "polyline", { points: pts, fill: "none", stroke: "#7c8cff", "stroke-width": 2 });
    var lv = r[r.length - 1], lp = pts.split(" ").pop().split(",");
    el(rs, "circle", { cx: lp[0], cy: lp[1], r: 3.5, fill: "#7c8cff" });
    $("rsiv").textContent = lv.toFixed(1) + " · " + (lv > 70 ? "Overbought" : lv < 30 ? "Oversold" : "Neutral");
    document.body.dataset.state = data.live ? "live" : "sample";
  }

  function refresh() {
    clearTimeout(timer);
    load().then(function (data) {
      draw(data);
      if (data.live) timer = setTimeout(refresh, 15000);
    });
  }

  var buttons = document.querySelectorAll(".chips button");
  buttons.forEach(function (b, i) {
    b.addEventListener("click", function () {
      buttons.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      interval = INTERVALS[i];
      refresh();
    });
  });
  refresh();
})();
</script>
</body>
</html>
