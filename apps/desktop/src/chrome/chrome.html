<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<style>
  :root { --bg: #f5f4f1; --surface: #fff; --ink: #1c1b19; --muted: #7a776f; --line: #e6e3dc; --brand: #1f9d63; --warn: #b4531a; --warn-bg: #fbeee6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --surface: #252421; --ink: #ecebe7; --muted: #9b978d; --line: #34322e; --brand: #3fbf84; --warn: #f0a073; --warn-bg: #3a2a20; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.3 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--ink); user-select: none; }
  .tabs { display: flex; gap: 4px; align-items: center; height: 38px; padding: 6px 8px 0; overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 6px; max-width: 200px; height: 30px; padding: 0 10px; border-radius: 9px 9px 0 0; color: var(--muted); cursor: default; white-space: nowrap; }
  .tab.active { background: var(--surface); color: var(--ink); }
  .tab .title { overflow: hidden; text-overflow: ellipsis; }
  .tab .x { opacity: .5; border: 0; background: none; color: inherit; cursor: pointer; padding: 0 2px; }
  .tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); flex: none; }
  .tab .dot.user { background: var(--muted); }
  .plus { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 8px; }
  .bar { display: flex; gap: 8px; align-items: center; height: 46px; padding: 0 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .url { flex: 1; min-width: 0; height: 30px; border: 1px solid var(--line); border-radius: 15px; padding: 0 12px; background: var(--bg); color: var(--ink); font: inherit; }
  .pill { display: none; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 12px; border-radius: 15px; background: var(--warn-bg); color: var(--warn); white-space: nowrap; }
  .pill.on { display: flex; }
  .pill.user { background: var(--bg); color: var(--muted); }
  .btn { height: 24px; border: 0; border-radius: 12px; padding: 0 12px; background: var(--ink); color: var(--surface); font: inherit; font-weight: 600; cursor: pointer; }
  .core { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .core.off { color: var(--warn); }
  .empty { padding: 6px 10px; color: var(--muted); }
</style>
</head>
<body>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <input class="url" id="url" placeholder="Buscá o escribí una dirección" spellcheck="false" />
    <div class="pill" id="pill"><span id="pill-text"></span><button class="btn" id="pill-btn"></button></div>
    <span class="core" id="core"></span>
  </div>
<script>
  const api = window.apxChrome;
  const $ = (id) => document.getElementById(id);
  let state = { tabs: [], active: undefined, core: "offline" };

  function render() {
    const tabs = $("tabs");
    tabs.replaceChildren();
    for (const t of state.tabs) {
      const el = document.createElement("div");
      el.className = "tab" + (t.tab === state.active ? " active" : "");
      el.title = `${t.title || t.url} · perfil ${t.profile}`;
      const dot = document.createElement("span");
      dot.className = "dot" + (t.control.kind === "agent" ? "" : " user");
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = t.title || t.url || "Nueva pestaña";
      const x = document.createElement("button");
      x.className = "x";
      x.textContent = "×";
      x.onclick = (e) => { e.stopPropagation(); api.close(t.tab); };
      el.append(dot, title, x);
      el.onclick = () => api.select(t.tab);
      tabs.append(el);
    }
    const plus = document.createElement("button");
    plus.className = "plus";
    plus.textContent = "+";
    plus.onclick = () => api.newTab("");
    tabs.append(plus);

    const active = state.tabs.find((t) => t.tab === state.active);
    const url = $("url");
    if (document.activeElement !== url) url.value = active ? active.url : "";
    const pill = $("pill");
    if (active && active.control.kind === "agent") {
      pill.className = "pill on";
      $("pill-text").textContent = `▲ ${active.control.by} está usando esta pestaña`;
      $("pill-btn").textContent = "Tomar control";
      $("pill-btn").onclick = () => api.take(active.tab);
    } else if (active && active.control.kind === "user") {
      pill.className = "pill on user";
      $("pill-text").textContent = "Tenés el control";
      $("pill-btn").textContent = "Devolver";
      $("pill-btn").onclick = () => api.give(active.tab);
    } else {
      pill.className = "pill";
    }
    $("core").textContent = state.core === "connected" ? "● core" : "○ core offline";
    $("core").className = "core" + (state.core === "connected" ? "" : " off");
  }

  $("url").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const value = e.target.value.trim();
    if (!value) return;
    if (state.active) api.navigate(state.active, value); else api.newTab(/^https?:/.test(value) ? value : `https://${value}`);
    e.target.blur();
  });
  api.onState((s) => { state = s; render(); });
  render();
</script>
</body>
</html>
