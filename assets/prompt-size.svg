<title id="t">Prompt size per model call: APX v2 vs APX v1, Hermes and OpenClaw</title>
<desc id="d">Tokens of system prompt and tool definitions in the first model call of a fresh install. APX v2: 8.2k (1467 system, 6728 tools); Hermes: 13.0k (3956 system, 9070 tools); APX v1 (Telegram, CLI, desktop): 13.2k (4626 system, 8609 tools); OpenClaw: 13.2k (9800 system, 3411 tools); APX v1 (web chat, API, routines): 23.6k (4115 system, 19441 tools).</desc>
